<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gmail Flow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>gf</h1>
      <p class="hint">email, calmer</p>

      <section class="profiles">
        <div class="profile-grid">
          <button class="profile-btn" data-profile="zen">
            <span class="profile-icon">🧘</span>
            <span class="profile-name">zen</span>
          </button>
          <button class="profile-btn" data-profile="speed">
            <span class="profile-icon">⚡</span>
            <span class="profile-name">speed</span>
          </button>
          <button class="profile-btn" data-profile="night">
            <span class="profile-icon">🌙</span>
            <span class="profile-name">night</span>
          </button>
          <button class="profile-btn" data-profile="focus">
            <span class="profile-icon">🎯</span>
            <span class="profile-name">focus</span>
          </button>
        </div>
      </section>

      <section class="quick-toggles">
        <label class="toggle-row">
          <span>age</span>
          <input id="showEmailAge" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span>priority</span>
          <input id="showPriorityBadges" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span>dark</span>
          <input id="darkMode" type="checkbox" />
        </label>
        <label class="toggle-row">
          <span>reading mode</span>
          <input id="readingMode" type="checkbox" />
        </label>
      </section>

      <section class="typography-section">
        <div class="section-label">typography</div>
        <div class="field-row">
          <label for="fontFamily">font</label>
          <select id="fontFamily">
            <option value="Atkinson Hyperlegible">Atkinson Hyperlegible</option>
            <option value="OpenDyslexic">OpenDyslexic</option>
            <option value="Lexie Readable">Lexie Readable</option>
            <option value="Inter">Inter</option>
            <option value="JetBrains Mono">JetBrains Mono</option>
            <option value="Fira Code">Fira Code</option>
            <option value="Cascadia Code">Cascadia Code</option>
            <option value="SF Mono">SF Mono</option>
            <option value="Comic Neue">Comic Neue</option>
            <option value="Lexend">Lexend</option>
            <option value="Andika">Andika</option>
            <option value="Literata">Literata</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Source Serif 4">Source Serif 4</option>
            <option value="Noto Serif">Noto Serif</option>
            <option value="system-ui">System Default</option>
          </select>
        </div>
        <div class="field-row">
          <label for="fontSize">size</label>
          <input id="fontSize" type="range" min="12" max="28" step="1" value="16" />
          <output id="fontSizeOutput">16px</output>
        </div>
        <div class="field-row">
          <label for="lineHeight">line height</label>
          <input id="lineHeight" type="range" min="1.0" max="2.5" step="0.1" value="1.5" />
          <output id="lineHeightOutput">1.5</output>
        </div>
        <div class="field-row">
          <label for="letterSpacing">letter</label>
          <input id="letterSpacing" type="range" min="0" max="3" step="0.1" value="0" />
          <output id="letterSpacingOutput">0px</output>
        </div>
        <div class="field-row">
          <label for="wordSpacing">word</label>
          <input id="wordSpacing" type="range" min="0" max="8" step="0.5" value="0" />
          <output id="wordSpacingOutput">0px</output>
        </div>
      </section>

      <section class="tint-section">
        <div class="section-label">background</div>
        <select id="backgroundTint">
          <option value="none">None</option>
          <option value="cream">Cream</option>
          <option value="lavender">Lavender</option>
          <option value="sage">Sage</option>
          <option value="blush">Blush</option>
          <option value="sky">Sky</option>
          <option value="amber">Amber</option>
          <option value="mint">Mint</option>
          <option value="rose">Rose</option>
          <option value="dusk">Dusk</option>
          <option value="moonlight">Moonlight</option>
          <option value="charcoal">Charcoal</option>
          <option value="oled">OLED Black</option>
          <option value="midnight">Midnight</option>
        </select>
      </section>

      <p id="status" class="status" aria-live="polite"></p>

      <a href="https://github.com/rico369/firstmate-extension" target="_blank" class="footer-link">source</a>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
